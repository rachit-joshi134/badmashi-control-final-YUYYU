[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Fallback until the NextLayer hub page (public/index.html) is added; not forced,
# so it stops applying automatically once that file exists.
[[redirects]]
  from = "/"
  to = "/isro/"
  status = 302

[[redirects]]
  from = "/isro/*"
  to = "/isro/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
